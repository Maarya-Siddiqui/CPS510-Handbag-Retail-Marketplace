<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handbag Marketplace</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <p class="bar">Authenticated pre-owned designer handbags</p>

  <header>
    <a class="logo" href="/">Handbag Marketplace</a>
    <nav>
      <button data-view="shop">Shop</button>
      <button id="sell">Sell</button>
      <button data-view="wishlist">Wishlist</button>
      <button data-view="cart">Cart</button>
      <button id="account">Sign in</button>
    </nav>
  </header>

  <!-- The page content is filled in by app.js -->
  <main id="view"></main>

  <!-- Pop-up: sign in / create account -->
  <dialog id="authDialog">
    <form id="authForm">
      <h2 id="authTitle">Sign in</h2>
      <div id="nameFields" hidden>
        <input name="firstName" placeholder="First name">
        <input name="lastName" placeholder="Last name">
        <input name="address" placeholder="Address">
      </div>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button class="solid" id="authSubmit">Sign in</button>
      <button type="button" class="link" id="authSwitch">Create an account</button>
      <button type="button" class="link" onclick="authDialog.close()">Cancel</button>
    </form>
  </dialog>

  <!-- Pop-up: create a listing -->
  <dialog id="sellDialog">
    <form id="sellForm">
      <h2>Sell a handbag</h2>
      <input name="designer" placeholder="Designer (e.g. Gucci)" required>
      <input name="modelName" placeholder="Model name" required>
      <select name="colour" aria-label="Colour">
        <option>Black</option><option>Brown</option><option>Tan</option><option>Beige</option><option>Gold</option>
        <option>Red</option><option>Green</option><option>Navy</option><option>White</option><option>Other</option>
      </select>
      <select name="condition" aria-label="Condition">
        <option>Excellent</option><option>Very Good</option><option>Good</option>
      </select>
      <textarea name="description" placeholder="Description"></textarea>
      <input name="serialNumber" placeholder="Serial number" required>
      <input name="price" type="number" min="1" step="0.01" placeholder="Price (CAD)" required>
      <input name="pickupLocation" placeholder="Pickup location (e.g. Toronto)" required>
      <button class="solid">Post listing</button>
      <button type="button" class="link" onclick="sellDialog.close()">Cancel</button>
    </form>
  </dialog>

  <!-- Pop-up: handbag details + reviews -->
  <dialog id="detailDialog"></dialog>

  <div id="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
